{% extends "admin_base.html" %}
{% block body %}
<div class="mx-auto" style="max-width:380px">
  <h1 class="h4 mb-3">Admin login</h1>
  {% if disabled %}
  <div class="alert alert-warning">Admin is disabled. Set the <code>ADMIN_PASSWORD</code> environment variable and restart the app.</div>
  {% else %}
  <form method="post" class="card card-body">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control mb-3" autofocus required>
    <button class="btn btn-gold">Log in</button>
  </form>{% endif %}
</div>
{% endblock %}
