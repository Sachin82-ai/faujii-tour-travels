<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Faujii Tour &amp; Travels</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>input,select,textarea{font-size:16px!important}.btn{min-height:40px}.navbar .container{gap:.6rem}@media(max-width:575px){.container{padding-left:12px;padding-right:12px}.table .btn{margin-bottom:.25rem}}body{background:#f4f5fa}.navbar{background:#101B50;border-bottom:3px solid #D5A344}.navbar a,.navbar .navbar-brand{color:#fff}.navbar a:hover{color:#D5A344}
.btn-gold{background:#D5A344;color:#101B50;border:0}.btn-gold:hover{background:#c4922f}.thumb{width:64px;height:44px;object-fit:cover;border-radius:6px;background:#ddd}</style>
</head><body>
<nav class="navbar navbar-expand-lg"><div class="container">
  <a class="navbar-brand fw-bold" href="{{ url_for('admin.dashboard') }}">Faujii Admin</a>
  {% if session.admin %}
  <div class="d-flex flex-wrap gap-3 align-items-center">
    {% for k, s in SCHEMA.items() %}<a href="{{ url_for('admin.listing', kind=k) }}">{{ s.title }}</a>{% endfor %}
    <a href="{{ url_for('admin.settings') }}">Contact</a>
    <a href="/" target="_blank">View site</a>
    <form method="post" action="{{ url_for('admin.logout') }}" class="m-0"><input type="hidden" name="csrf" value="{{ csrf() }}">
      <button class="btn btn-sm btn-outline-light">Log out</button></form>
  </div>{% endif %}
</div></nav>
<div class="container py-4">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% block body %}{% endblock %}
</div></body></html>
