# /etc/nginx/sites-available/faujii  (replace the domain; certbot adds the HTTPS block)
server {
    listen 80;
    server_name faujiitourtravels.com www.faujiitourtravels.com;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /static/ {
        alias /var/www/faujii/static/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
